name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm story:build

  # A `v*` tag publishes to npm once the NPM_TOKEN secret exists (the @invadelol scope is the
  # owner's to create); until then the job only says why it skipped.
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set; not publishing ${GITHUB_REF_NAME}."
      - if: env.NPM_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.NPM_TOKEN != ''
        uses: pnpm/action-setup@v4
      - if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: env.NPM_TOKEN != ''
        name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - if: env.NPM_TOKEN != ''
        run: pnpm install --frozen-lockfile && pnpm build
      - if: env.NPM_TOKEN != ''
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
